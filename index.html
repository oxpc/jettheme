<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetKeyboard | Theme Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .kb-preview { border-radius: 12px; height: 120px; position: relative; overflow: hidden; }
        .key { width: 24px; height: 32px; border-radius: 4px; display: inline-block; margin: 2px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-2">
                    Jet<span class="text-blue-500">Theme</span>
                </h1>
                <p class="text-slate-400 text-lg">Modern themes for your favorite keyboard.</p>
            </div>
            <a href="#" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-full font-semibold transition-all shadow-lg shadow-blue-500/20">
                Download Keyboard
            </a>
        </header>

        <div id="theme-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Themes will be injected here -->
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-40 bg-slate-800 rounded-2xl"></div>
                <div class="h-6 bg-slate-800 rounded w-3/4"></div>
            </div>
        </div>

        <footer class="mt-24 text-center text-slate-500 border-t border-slate-800 pt-8">
            <p>&copy; 2026 Jet KB. Powered by hajif.</p>
        </footer>
    </div>

    <script>
        async function loadThemes() {
            try {
                const response = await fetch('themes.json');
                const data = await response.json();
                const grid = document.getElementById('theme-grid');
                grid.innerHTML = '';

                data.themes.forEach(theme => {
                    const card = document.createElement('div');
                    card.className = 'glass rounded-3xl p-6 transition-all hover:scale-[1.02] hover:border-blue-500/50';
                    
                    card.innerHTML = `
                        <div class="kb-preview mb-6 flex flex-col justify-center items-center gap-2" style="background-color: ${theme.colors.bgKeyboard}">
                            <div class="flex gap-1">
                                ${Array(5).fill(`<div class="key shadow-sm" style="background-color: ${theme.colors.keyBg}; border: 1px solid rgba(0,0,0,0.1)"></div>`).join('')}
                            </div>
                            <div class="flex gap-1">
                                ${Array(4).fill(`<div class="key shadow-sm" style="background-color: ${theme.colors.keyBgFunc}; border: 1px solid rgba(0,0,0,0.1)"></div>`).join('')}
                            </div>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <h3 class="text-xl font-bold mb-1">${theme.name}</h3>
                                <p class="text-slate-400 text-sm">by ${theme.author}</p>
                            </div>
                            <div class="flex gap-2">
                                <div class="w-6 h-6 rounded-full border border-white/20" style="background-color: ${theme.colors.bgKeyboard}"></div>
                                <div class="w-6 h-6 rounded-full border border-white/20" style="background-color: ${theme.colors.keyAccent}"></div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading themes:', error);
                document.getElementById('theme-grid').innerHTML = '<p class="text-red-400">Failed to load themes. Please try again later.</p>';
            }
        }
        loadThemes();
    </script>
</body>
</html>
