<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetKeyboard | Theme Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #1F1F1F; }
        .glass { background: #FFFFFF; border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        .kb-preview { border-radius: 16px; height: 130px; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        .key { width: 26px; height: 36px; border-radius: 6px; display: inline-block; margin: 2px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-3 text-slate-900">
                    Jet<span class="text-blue-600">Theme</span>
                </h1>
                <p class="text-slate-500 text-lg font-medium">Expressive Material 3 themes for jet keyboard app.</p>
            </div>
            <a href="#" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-bold transition-all shadow-xl shadow-blue-500/25 active:scale-95">
                Get the App
            </a>
        </header>

        <div id="theme-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Themes loaded via JS -->
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-44 bg-slate-200 rounded-3xl"></div>
                <div class="h-6 bg-slate-200 rounded w-2/3"></div>
            </div>
        </div>

        <footer class="mt-32 text-center text-slate-400 border-t border-slate-200 pt-10 pb-10">
            <p class="font-semibold">&copy; 2026 Jet Keyboard. Crafted with ❤️ by jetkb team.</p>
        </footer>
    </div>

    <script>
        async function loadThemes() {
            try {
                const response = await fetch('themes.json');
                const data = await response.json();
                const grid = document.getElementById('theme-grid');
                grid.innerHTML = '';

                data.themes.forEach(theme => {
                    const card = document.createElement('div');
                    card.className = 'glass rounded-[32px] p-8 transition-all hover:-translate-y-2 hover:shadow-2xl hover:border-blue-500/20 group';
                    
                    card.innerHTML = `
                        <div class="kb-preview mb-8 flex flex-col justify-center items-center gap-2" style="background-color: ${theme.colors.bgKeyboard}">
                            <div class="flex gap-1">
                                ${Array(5).fill(`<div class="key shadow-sm" style="background-color: ${theme.colors.keyBg}"></div>`).join('')}
                            </div>
                            <div class="flex gap-1">
                                ${Array(4).fill(`<div class="key shadow-sm opacity-80" style="background-color: ${theme.colors.keyBgFunc || theme.colors.keyBg}"></div>`).join('')}
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="text-2xl font-black text-slate-900 mb-1">${theme.name}</h3>
                                <p class="text-slate-400 font-bold text-sm uppercase tracking-widest">${theme.author}</p>
                            </div>
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-inner" style="background-color: ${theme.colors.keyAccent}">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500 font-bold">Failed to load the store. Check back soon!</div>';
            }
        }
        loadThemes();
    </script>
</body>
</html>
